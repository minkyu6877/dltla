control:
  tolerance: 0.08
  max_velocity: 0.30
  uwb_timeout: 0.50
  control_rate_hz: 20.0
  # Robot-specific standby slots.  Change only these values when the
  # physical standby marking moves on the floor.
  home_positions:
    robot1: [1.70, 0.40]
    robot2: [2.30, 0.40]
  # Robot 2 has no UWB in the real fleet.  It follows delayed velocity
  # commands from robot 1 and is manually placed in its standby slot.
  robot2_uses_uwb: false
  robot2_follower_delay: 1.0
  robot2_formation_offset: [0.60, 0.00]

missions:
  SMALL_A:
    robots: 1
    route:
      - [1.0, 0.0]
      - [2.0, 0.0]
      - [4.0, 1.0]

  LONG_A:
    robots: 2
    follower_delay: 1.0
    route:
      - [1.0, 0.0]
      - [3.0, 0.5]
      - [5.0, 2.0]
